<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CNV 2025 - Telão</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      /* Paleta TUNAP */
      --cnv-primary: #2797ff;
      --cnv-secondary: #0b67bc;
      --cnv-tertiary: #acc420;
      --cnv-alternate: #e0e3e7;
      --cnv-text-primary: #161c24;
      --cnv-text-secondary: #636f81;
      --cnv-bg-primary: #ebeef2;
      --cnv-bg-secondary: #fefefe;
    }

    .fade-in {
      opacity: 1;
      transition: opacity 0.3s ease-in;
    }
    
    .fade-out {
      opacity: 0;
      transition: opacity 0.3s ease-out;
    }

    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: linear-gradient(180deg,
        #0a3d62 0%, 
        #0b4f84 40%,
        #0865b0 70%,
        #053864 100%
      );
      position: relative;
    }

    /* ================================ */
    /* OCEANO - CAMADAS DE FUNDO */
    /* ================================ */

    .ocean-background {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    /* Raios de luz (crepuscular) */
    .light-rays {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        linear-gradient(120deg, transparent 40%, rgba(255,255,255,0.03) 50%, transparent 60%),
        linear-gradient(160deg, transparent 30%, rgba(255,255,255,0.02) 40%, transparent 50%),
        linear-gradient(200deg, transparent 50%, rgba(255,255,255,0.03) 60%, transparent 70%);
      animation: lightShift 20s ease-in-out infinite;
    }

    @keyframes lightShift {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.5; }
    }

    /* Partículas flutuantes (plâncton) */
    .particles {
      position: absolute;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      background: var(--cnv-tertiary);
      border-radius: 50%;
      opacity: 0;
      animation: floatParticle 15s infinite ease-in-out;
      box-shadow: 0 0 8px var(--cnv-tertiary);
    }

    .particle:nth-child(1) { left: 10%; width: 4px; height: 4px; animation-delay: 0s; animation-duration: 18s; }
    .particle:nth-child(2) { left: 25%; width: 6px; height: 6px; animation-delay: 2s; animation-duration: 16s; }
    .particle:nth-child(3) { left: 45%; width: 3px; height: 3px; animation-delay: 4s; animation-duration: 20s; }
    .particle:nth-child(4) { left: 60%; width: 5px; height: 5px; animation-delay: 1s; animation-duration: 17s; }
    .particle:nth-child(5) { left: 80%; width: 4px; height: 4px; animation-delay: 3s; animation-duration: 19s; }
    .particle:nth-child(6) { left: 15%; width: 5px; height: 5px; animation-delay: 5s; animation-duration: 15s; }
    .particle:nth-child(7) { left: 35%; width: 3px; height: 3px; animation-delay: 2.5s; animation-duration: 21s; }
    .particle:nth-child(8) { left: 70%; width: 6px; height: 6px; animation-delay: 4.5s; animation-duration: 18s; }

    @keyframes floatParticle {
      0% { 
        transform: translateY(110vh) translateX(0);
        opacity: 0;
      }
      10% {
        opacity: 0.4;
      }
      50% {
        transform: translateY(50vh) translateX(30px);
        opacity: 0.6;
      }
      90% {
        opacity: 0.3;
      }
      100% { 
        transform: translateY(-10vh) translateX(-20px);
        opacity: 0;
      }
    }

    /* Ondas no topo */
    .waves {
      position: absolute;
      top: 0;
      left: -50px;
      width: calc(100% + 100px);
      height: 150px;
      background: var(--cnv-tertiary);
      opacity: 0.12;
      clip-path: polygon(
        0 40%, 
        10% 35%, 
        20% 45%, 
        30% 38%, 
        40% 48%, 
        50% 40%, 
        60% 45%, 
        70% 38%, 
        80% 43%, 
        90% 38%, 
        100% 45%, 
        100% 0, 
        0 0
      );
      animation: waveMove 8s ease-in-out infinite;
    }

    @keyframes waveMove {
      0%, 100% { transform: translateX(0); }
      50% { transform: translateX(-30px); }
    }

    /* Vignette (foco central) */
    .vignette {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(
        ellipse at center,
        transparent 20%,
        rgba(0, 0, 0, 0.15) 80%,
        rgba(0, 0, 0, 0.3) 100%
      );
      pointer-events: none;
    }

    /* ================================ */
    /* CONTEÚDO */
    /* ================================ */

    #telaoContainer {
      position: relative;
      z-index: 10;
      color: white;
    }

    .fade-in {
      animation: fadeIn 0.6s ease-in;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Animação de respiração (modo aguardando) */
    .breathe {
      animation: breathe 4s ease-in-out infinite;
    }

    @keyframes breathe {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.03); opacity: 0.9; }
    }

    /* Countdown pulse */
    .countdown-display {
      animation: pulse 1s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    /* Card oceânico */
    .ocean-card {
      background: linear-gradient(145deg, 
        #ffffff 0%,
        #ebeef2 60%,
        #e0e8f0 100%
      );
      border: 3px solid rgba(39, 151, 255, 0.5);
      border-radius: 28px;
      box-shadow: 
        0 20px 60px rgba(39, 151, 255, 0.35),
        0 8px 16px rgba(0, 0, 0, 0.15),
        inset 0 2px 0 rgba(255, 255, 255, 0.8),
        inset 0 -2px 8px rgba(39, 151, 255, 0.1);
      color: #161c24 !important;
    }
    
    .ocean-card h2 {
      color: #0b67bc !important;
      font-weight: 900;
      text-shadow: 0 2px 4px rgba(11, 103, 188, 0.2);
      letter-spacing: -0.5px;
    }
    
    .ocean-card p {
      color: #161c24 !important;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
      font-weight: 500;
    }
    
    .ocean-card::before {
      content: '';
      position: absolute;
      top: -2px;
      left: 20%;
      width: 60%;
      height: 40%;
      background: linear-gradient(180deg, 
        rgba(255, 255, 255, 0.6) 0%,
        transparent 100%
      );
      border-radius: 28px 28px 0 0;
      pointer-events: none;
    }

    /* Glow effect para destaques */
    .glow-soft {
      color: white;
      text-shadow:
        0 2px 6px rgba(0, 0, 0, 0.45),
        0 4px 12px rgba(0, 0, 0, 0.35);
    }

    /* Bolhas animadas (modo perguntas) */
    .bubble {
      animation: bubbleFloat 3s ease-in-out infinite;
    }

    @keyframes bubbleFloat {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-10px) scale(1.02); }
    }

    /* Shimmer effect */
    .shimmer {
      background: linear-gradient(
        90deg,
        transparent 0%,
        rgba(255, 255, 255, 0.3) 50%,
        transparent 100%
      );
      background-size: 200% 100%;
      animation: shimmer 3s infinite;
    }

    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }

    /* Título topo - Mar de Oportunidades */
      .header-title {
        position: fixed;
        top: 2rem;
        left: 50%;
        transform: translateX(-50%);
        z-index: 100;
        font-size: 2.5rem;
        font-weight: 700;
        color: rgba(255, 255, 255, 0.85);
        text-shadow: 
          0 2px 8px rgba(0, 0, 0, 0.4),
          0 0 30px rgba(39, 151, 255, 0.3);
        letter-spacing: 2px;
        text-transform: uppercase;
        animation: fadeInDown 1s ease-out;
      }
      
      @keyframes fadeInDown {
        from {
          opacity: 0;
          transform: translateX(-50%) translateY(-20px);
        }
        to {
          opacity: 1;
          transform: translateX(-50%) translateY(0);
        }
      }
      
      /* Rodapé - TUNAP Labs */
      .footer-label {
        position: fixed;
        bottom: 1.5rem;
        left: 50%;
        transform: translateX(-50%);
        z-index: 100;
        font-size: 1rem;
        font-weight: 400;
        color: rgba(255, 255, 255, 0.35);
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.3);
        letter-spacing: 1px;
      }  
    }
    
    /* Animação suave no título "Mar de Oportunidades" */
    .animate-motivational {
      animation: pulseSoft 5s ease-in-out infinite;
    }
    
    @keyframes pulseSoft {
      0%, 100% {
        transform: translateY(0);
        text-shadow: 0 0 18px rgba(255, 255, 255, 0.4);
      }
      50% {
        transform: translateY(-4px);
        text-shadow: 0 0 28px rgba(255, 255, 255, 0.8);
      }
    }
    
    /* Frase motivacional aparecendo/sumindo de leve */
    .motivational-subtitle {
      animation: fadeSlideUp 8s ease-in-out infinite;
    }
    
    @keyframes fadeSlideUp {
      0% {
        opacity: 0;
        transform: translateY(12px);
      }
      20% {
        opacity: 1;
        transform: translateY(0);
      }
      80% {
        opacity: 1;
      }
      100% {
        opacity: 0;
        transform: translateY(-6px);
      }
    }

    .fade-out {
      opacity: 0;
      transition: opacity 0.9s ease-in-out;
    }
    
    .fade-in {
      opacity: 1;
      transition: opacity 0.9s ease-in-out;
    }

    .sonar-line {
      background: linear-gradient(90deg,
        transparent,
        rgba(255, 255, 255, 0.8),
        transparent
      );
      background-size: 200% 100%;
      animation: sonarMove 3s linear infinite;
      opacity: 0.6;
      border-radius: 4px;
    }
    
    @keyframes sonarMove {
      0% {
        background-position-x: 200%;
      }
      100% {
        background-position-x: -200%;
      }
    }

  </style>
</head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>

<body class="min-h-screen flex items-center justify-center text-white">
  
  <!-- Background oceânico -->
  <div class="ocean-background">
  
  <!-- Background oceânico -->
  <div class="ocean-background">
    <div class="light-rays"></div>
    <div class="particles">
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
    </div>
    <div class="waves"></div>
    <div class="vignette"></div>
  </div>

  <!-- Conteúdo dinâmico -->
  <div id="telaoContainer" class="w-full h-screen p-8">
    <!-- Renderizado via JS -->
  </div>

  <!-- Conteúdo dinâmico -->
  <div id="telaoContainer" class="w-full h-screen p-8">
    <!-- Renderizado via JS -->
  </div>

  <!-- Rodapé -->
  <div class="footer-label">TUNAP Labs 🚀</div>

  <script src="telao.js"></script>
</body>
</html>
