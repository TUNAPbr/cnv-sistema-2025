<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CNV 2025 - Participante</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    .btn-opcao {
      transition: all 0.3s ease;
    }
    .btn-opcao:active {
      transform: scale(0.95);
    }

    /* Gradiente TUNAP no fundo */
    body {
      background: linear-gradient(180deg, #0095c8 0%, #005b82 100%);
      background-size: 200% 200%;
      animation: tunapGradient 12s ease infinite;
    }
  
    /* Fade-in suave */
    .animate-fadein {
      animation: fadein 0.6s ease-out;
    }
    @keyframes fadein {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  
    /* Pulso lento */
    .animate-pulse-slow {
      animation: pulseslow 2.5s ease-in-out infinite;
    }
    @keyframes pulseslow {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }

    @keyframes tunapGradient {
      0% { background-position: 0% 0%; }
      50% { background-position: 100% 100%; }
      100% { background-position: 0% 0%; }
    }

    /* Fade-in rápido */
    .animate-fadein {
      animation: fadein 0.5s ease-out forwards;
    }
    @keyframes fadein {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    
    /* Fade-in lento */
    .animate-fadein-slow {
      animation: fadein 1.4s ease-out forwards;
    }
    
    /* Slide de baixo pra cima */
    .animate-slideup {
      animation: slideup 0.6s cubic-bezier(0.25, 0.15, 0.15, 1) forwards;
    }
    @keyframes slideup {
      from { transform: translateY(18px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    
    /* Pulso visual mais elegante */
    .animate-pulse-slow {
      animation: pulseSlow 2.5s ease-in-out infinite;
    }
    @keyframes pulseSlow {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }

  </style>
</head>

<body class="min-h-screen">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js?v=2.0"></script>
<script src="participante.js?v=2.0"></script>
  
  <!-- Header -->
  <header class="backdrop-blur-md bg-white/30 shadow-sm">
    <div class="container mx-auto py-4">
      <h1 id="nomeEvento" class="text-2xl font-extrabold text-white tracking-wide text-center drop-shadow-md">
        CNV 2025
      </h1>
    </div>
  </header>

  <!-- Conteúdo Principal -->
  <main class="container mx-auto p-4">
    <div id="participanteContainer" class="bg-white/95 rounded-2xl p-8 min-h-[70vh] shadow-[0_20px_40px_rgba(0,0,0,0.20)] backdrop-blur-md transition-all duration-500">
      <!-- Conteúdo dinâmico -->
    </div>
  </main>

  <!-- Footer -->
  <footer class="text-center text-white py-4">
    <p class="text-sm opacity-75">© 2025 - TUNAP Labs 🚀</p>
  </footer>

</body>
</html>
