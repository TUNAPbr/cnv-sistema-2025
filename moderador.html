<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CNV 2025 - Moderador</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --cor-primaria: #0066CC;
      --cor-secundaria: #FF6B00;
    }
    .btn-modo { @apply px-6 py-3 rounded-lg font-bold text-white transition-all; }
    .btn-modo-ativo { background-color: var(--cor-primaria); transform: scale(1.05); }
    .btn-modo-inativo { @apply bg-gray-300 text-gray-700; }
  </style>
</head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>

<script src="moderador.js"></script>
<script src="moderador-cadastros.js"></script>
<script src="moderador-controle.js"></script>
<script src="moderador-exportar.js"></script>
<script src="moderador-quiz.js"></script>

  
<body class="bg-gray-100 min-h-screen">
  
  <!-- Header -->
  <header class="bg-white shadow-md p-4">
    <div class="container mx-auto flex justify-between items-center">
      <h1 class="text-2xl font-bold" style="color: var(--cor-primaria);">
        <span id="nomeEvento">CNV 2025</span> - Moderador
      </h1>
      <div class="flex gap-2">
        <button onclick="abrirConfig()" class="px-4 py-2 bg-gray-200 rounded hover:bg-gray-300">
          ⚙️ Configurações
        </button>
        <button onclick="location.reload()" class="px-4 py-2 bg-gray-200 rounded hover:bg-gray-300">
          🔄 Atualizar
        </button>
      </div>
    </div>
  </header>

  <div class="container mx-auto p-6">
    
    <!-- Seletor de Modo -->
    <div class="bg-white rounded-lg shadow-md p-6 mb-6">
      <h2 class="text-xl font-bold mb-4">🎯 Modo Ativo</h2>
      <div class="flex gap-4 flex-wrap">
        <button id="btnModoAguardando" onclick="mudarModo('aguardando')" class="btn-modo btn-modo-inativo">
          ⏸️ Aguardando
        </button>
        <button id="btnModoPerguntas" onclick="mudarModo('perguntas')" class="btn-modo btn-modo-inativo">
          📊 Perguntas
        </button>
        <button id="btnModoEnquetes" onclick="mudarModo('enquetes')" class="btn-modo btn-modo-inativo">
          📋 Enquetes
        </button>
        <button id="btnModoQuiz" onclick="mudarModo('quiz')" class="btn-modo btn-modo-inativo">
          🎮 Quiz
        </button>
      </div>
      <div id="statusModo" class="mt-4 p-3 bg-blue-50 rounded text-sm"></div>
    </div>

    <!-- Abas de Conteúdo -->
    <div class="bg-white rounded-lg shadow-md">
      <!-- Tabs -->
      <div class="border-b flex">
        <button onclick="abrirAba('cadastros')" id="tabCadastros" class="px-6 py-3 border-b-2 border-transparent hover:border-blue-500">
          📝 Cadastros
        </button>
        <button onclick="abrirAba('controle')" id="tabControle" class="px-6 py-3 border-b-2 border-transparent hover:border-blue-500">
          🎛️ Controle
        </button>
        <button onclick="abrirAba('exportar')" id="tabExportar" class="px-6 py-3 border-b-2 border-transparent hover:border-blue-500">
          📤 Exportar
        </button>
      </div>

      <!-- Conteúdo das Abas -->
      <div class="p-6">
        
        <!-- ABA: CADASTROS -->
        <div id="abaCadastros" class="hidden">
          <div class="flex gap-4 mb-4">
            <button onclick="abrirSubAba('palestras')" id="subPalestras" class="px-4 py-2 bg-gray-200 rounded">Palestras</button>
            <button onclick="abrirSubAba('enquetes')" id="subEnquetes" class="px-4 py-2 bg-gray-200 rounded">Enquetes</button>
            <button onclick="abrirSubAba('quizzes')" id="subQuizzes" class="px-4 py-2 bg-gray-200 rounded">Quizzes</button>
          </div>

          <!-- Sub-aba: Palestras -->
          <div id="subAbaPalestras" class="hidden">
            <div class="flex justify-between items-center mb-4">
              <h3 class="text-lg font-bold">Palestras</h3>
              <button onclick="abrirModalPalestra()" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">
                ➕ Nova Palestra
              </button>
            </div>
            <div id="listaPalestras" class="space-y-2"></div>
          </div>

          <!-- Sub-aba: Enquetes -->
          <div id="subAbaEnquetes" class="hidden">
            <div class="flex justify-between items-center mb-4">
              <h3 class="text-lg font-bold">Enquetes</h3>
              <button onclick="abrirModalEnquete()" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">
                ➕ Nova Enquete
              </button>
            </div>
            <div id="listaEnquetes" class="space-y-2"></div>
          </div>

          <!-- Sub-aba: Quizzes -->
          <div id="subAbaQuizzes" class="hidden">
            <div class="flex justify-between items-center mb-4">
              <h3 class="text-lg font-bold">Quizzes</h3>
              <button onclick="abrirModalQuiz()" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">
                ➕ Novo Quiz
              </button>
            </div>
            <div id="listaQuizzes" class="space-y-2"></div>
          </div>
        </div>

        <!-- ABA: CONTROLE -->
        <div id="abaControle" class="hidden">
          <div id="controlePerguntas" class="hidden">
            <h3 class="text-lg font-bold mb-4">Controle de Perguntas</h3>
            <div id="controleStatusPerguntas" class="mb-4"></div>
            <div id="listaPerguntasRecebidas" class="space-y-2"></div>
          </div>

          <div id="controleEnquetes" class="hidden">
            <h3 class="text-lg font-bold mb-4">Controle de Enquetes</h3>
            <div id="controleStatusEnquetes" class="mb-4"></div>
            <div id="controleResultadoEnquete" class="mt-4"></div>
          </div>

          <div id="controleQuiz" class="hidden">
            <h3 class="text-lg font-bold mb-4">Controle de Quiz</h3>
            <div id="controleStatusQuiz" class="mb-4"></div>
            <div id="controleListaPerguntas" class="space-y-2 mb-4"></div>
            <div id="controleRankingQuiz" class="mt-4"></div>
          </div>
        </div>

        <!-- ABA: EXPORTAR -->
        <div id="abaExportar" class="hidden">
          <h3 class="text-lg font-bold mb-4">Exportar Dados</h3>
          <div class="space-y-4">
            <div class="p-4 border rounded">
              <h4 class="font-bold mb-2">📊 Perguntas de Palestras</h4>
              <select id="exportPalestraSelect" class="w-full p-2 border rounded mb-2"></select>
              <button onclick="exportarPerguntas()" class="px-4 py-2 bg-green-600 text-white rounded hover:bg-green-700">
                💾 Exportar CSV
              </button>
            </div>
            <div class="p-4 border rounded">
              <h4 class="font-bold mb-2">📋 Resultado de Enquetes</h4>
              <select id="exportEnqueteSelect" class="w-full p-2 border rounded mb-2"></select>
              <button onclick="exportarEnquete()" class="px-4 py-2 bg-green-600 text-white rounded hover:bg-green-700">
                💾 Exportar CSV
              </button>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- Modals serão criados dinamicamente -->
  <div id="modalContainer"></div>

  
</body>
</html>
