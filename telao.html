<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CNV 2025 - Telão</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    .countdown-display {
      animation: pulse 1s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    .fade-in {
      animation: fadeIn 0.5s ease-in;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>
</head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>

<script src="moderador.js"></script>
<script src="moderador-cadastros.js"></script>
<script src="moderador-controle.js"></script>
<script src="moderador-exportar.js"></script>
<script src="moderador-quiz.js"></script>

<body class="min-h-screen flex items-center justify-center text-white">
  
  <div id="telaoContainer" class="w-full h-screen p-8">
    <!-- Conteúdo dinâmico -->
  </div>

  <script src="telao.js"></script>
</body>
</html>
